# 오늘의 우리 — 텔레그램 알림봇
#
# 15분마다 깨어나서:
#   1) 그동안 온 명령어(/오늘 /주간 /월간 /시간 …)를 처리하고 답장
#   2) 정해진 시각이 지났는데 오늘 아직 안 보냈으면 → 브리핑 발송
#
# 보내는 시각은 텔레그램에서 "/시간 8:00" 으로 바꾸면 되고,
# config/telegram.json 에 저장된다. (이 파일을 직접 고칠 필요 없음)
name: 오늘의 주요 일정 알림

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot          # 여러 개가 동시에 돌아 중복 발송되는 것 방지
  cancel-in-progress: false

permissions:
  contents: write              # 설정(config/telegram.json) 저장용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 명령 처리 + 브리핑
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-bot.js

      - name: 바뀐 설정 저장
        run: |
          if [ -n "$(git status --porcelain config/)" ]; then
            git config user.name  "오늘의우리 봇"
            git config user.email "actions@github.com"
            git add config/
            git commit -m "설정 갱신 [skip ci]"
            git push
          else
            echo "바뀐 설정 없음"
          fi
